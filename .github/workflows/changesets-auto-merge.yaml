name: Changesets auto-merge
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
jobs:
  changesets:
    name: "Changesets: Merge"
    runs-on: ubuntu-26.04
    steps:
      - id: release-bot-token
        name: Mint psirenny Bot installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - name: Merge the Changesets Release pull request
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pull_request_number="$(
            gh pr list --base main --head changeset-release/main --state open --json number --jq '.[0].number // empty'
          )"

          if [[ -n "${pull_request_number}" ]]; then
            gh pr merge "${pull_request_number}" --squash
          else
            echo "No open Release pull request to merge."
          fi
