name: Changesets version
on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  changesets:
    name: "Changesets: Version"
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - name: Install Node.js dependencies
        run: pnpm install
      - id: release-bot-token
        name: Mint psirenny Bot installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - name: Changesets — Open or update a Release pull request
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          commit-message: Release 🚀
          # The action ignores a `GITHUB_TOKEN` environment variable, so the psirenny Bot token has
          # to be passed explicitly. A push made with the default `GITHUB_TOKEN` doesn't trigger
          # other workflows, so the Release pull request would never run CI.
          github-token: ${{ steps.release-bot-token.outputs.token }}
          pr-title: Release 🚀
          version-script: pnpm run version
