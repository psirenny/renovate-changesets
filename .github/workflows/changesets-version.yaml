name: Changesets version
on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  changesets:
    name: "Changesets: Version"
    runs-on: ubuntu-26.04
    permissions: write-all
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - name: Install Node.js dependencies
        run: pnpm install
      - id: release-bot-token
        name: Mint psirenny Bot installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - name: Changesets — Open or update a Release pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: Release 🚀
          # The action ignores a `GITHUB_TOKEN` environment variable, so the psirenny Bot token has
          # to be passed explicitly. A push made with the default `GITHUB_TOKEN` doesn't trigger
          # other workflows, so the Release pull request would never run CI.
          github-token: ${{ steps.release-bot-token.outputs.token }}
          pr-title: Release 🚀
          version-script: pnpm run version
