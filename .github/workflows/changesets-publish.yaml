name: Changesets publish
on:
  pull_request:
    branches:
      - main
    types:
      - closed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  changesets:
    if: >-
      github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'changeset-release/main'
    name: "Changesets: Publish"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - id: release-bot-token
        name: Mint psirenny Bot installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - name: Checkout Git repository from the Release pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Avoid GitHub Merge Queue combining newer changesets along side an older release:
          # https://github.com/changesets/action/issues/507
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.release-bot-token.outputs.token }}
      - name: Install PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - name: Install Node.js dependencies
        run: pnpm install
      - name: Changesets — Publish to npm, tag the release, and create the GitHub release
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          NPM_CONFIG_PROVENANCE: "true"
        with:
          # The action ignores a `GITHUB_TOKEN` environment variable, so the psirenny Bot token has
          # to be passed explicitly for the tags and release to be attributed to it.
          github-token: ${{ steps.release-bot-token.outputs.token }}
          publish-script: pnpm run publish-packages
